<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Attributes Page</title>
    <link rel="stylesheet" href="attr.css">
</head>
<body>
    <div class="container">
        <h1>HTML Attributes Demo</h1>
        <a href="https://example.com" target="_blank" title="Go to Example" download>Download File</a>
        <input type="text" placeholder="Enter Your Name" required maxlength="20">
        <small class="hint">Max 20 characters allowed</small>
        <img src="https://via.placeholder.com/200" alt="Sample Image" width="200" height="150">
        <button type="submit" disabled>Submit</button>
        <label>
            <input type="checkbox" checked> Subscribe to Newsletter
        </label>
    </div>
</body>
</html>
